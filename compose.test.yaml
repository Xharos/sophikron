name: sophikron-local-tests

x-database-environment: &database-environment
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: sophikron_test
  DB_USER: sophikron_app
  DB_PASSWORD_FILE: /run/secrets/db_app_password
  DB_SSLMODE: disable

services:
  db:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    environment:
      POSTGRES_DB: sophikron_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for role in admin app migration; do
          head -c 32 /dev/urandom | base64 \
            > "/run/secrets/db_$${role}_password"
          chmod 0444 "/run/secrets/db_$${role}_password"
        done
        exec /usr/local/bin/docker-entrypoint.sh postgres
    volumes:
      - test_secrets:/run/secrets
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres",
         "-d", "sophikron_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *database-environment
    volumes:
      - test_secrets:/run/secrets:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://localhost:8000/health", timeout=2)
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY backend/ .
        RUN pip install --no-cache-dir ".[dev]"
    environment:
      <<: *database-environment
      DB_INTEGRATION: "1"
      DB_TEST_MIGRATION_PASSWORD_FILE: /run/secrets/db_migration_password
      DB_TEST_API_URL: http://backend:8000
    volumes:
      - test_secrets:/run/secrets:ro
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "-m", "pytest", "-v"]

volumes:
  test_secrets:
