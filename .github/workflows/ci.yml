name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: python -m pip install -e ".[dev]"

      - name: Lint with Ruff
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q -m "not integration"

      - name: Prepare isolated PostgreSQL test secrets
        shell: bash
        run: |
          umask 077
          secret_dir="$RUNNER_TEMP/sophikron-db-secrets"
          mkdir -p "$secret_dir"
          openssl rand -hex 32 > "$secret_dir/bootstrap_password"
          touch "$secret_dir/smtp_password"
          chmod 0444 "$secret_dir/bootstrap_password" "$secret_dir/smtp_password"
          echo "SOPHIKRON_SECRETS_DIRECTORY=$secret_dir" >> "$GITHUB_ENV"
          echo "AUTH_BOOTSTRAP_USERNAME=ci_setup" >> "$GITHUB_ENV"
          for role in admin app migration; do
            openssl rand -hex 32 > "$secret_dir/db_${role}_password"
            chmod 0444 "$secret_dir/db_${role}_password"
          done
          encryption_key=$(openssl rand -base64 32)
          lookup_key=$(openssl rand -base64 32)
          printf '{"active_key":"ci","encryption_keys":{"ci":"%s"},"lookup_key":"%s"}\n' \
            "$encryption_key" "$lookup_key" > "$secret_dir/identity_keys.json"
          chmod 0444 "$secret_dir/identity_keys.json"
          echo "DB_NAME=sophikron_test" >> "$GITHUB_ENV"
          echo "DB_HOST=127.0.0.1" >> "$GITHUB_ENV"
          echo "DB_PORT=5432" >> "$GITHUB_ENV"
          echo "DB_USER=sophikron_app" >> "$GITHUB_ENV"
          echo "DB_PASSWORD_FILE=$secret_dir/db_app_password" >> "$GITHUB_ENV"
          echo "DB_TEST_MIGRATION_PASSWORD_FILE=$secret_dir/db_migration_password" >> "$GITHUB_ENV"
          echo "DB_TEST_API_URL=http://127.0.0.1:8000" >> "$GITHUB_ENV"
          echo "AUTH_ENVIRONMENT=development" >> "$GITHUB_ENV"
          echo 'AUTH_ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8000"]' >> "$GITHUB_ENV"
          echo "AUTH_COOKIE_SECURE=false" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        working-directory: .
        run: docker compose -f compose.yaml -f compose.local.yaml config --quiet

      - name: Start full PostgreSQL and API services
        working-directory: .
        timeout-minutes: 15
        run: |
          docker compose -f compose.yaml -f compose.local.yaml -p sophikron-ci up -d --build --wait db backend

      - name: PostgreSQL integration tests
        env:
          DB_INTEGRATION: "1"
        run: python -m pytest -q -m integration

      - name: Stop verification services
        # Earlier failures can skip secret preparation; Compose down also needs this path.
        if: ${{ always() && env.SOPHIKRON_SECRETS_DIRECTORY != '' }}
        working-directory: .
        run: >-
          docker compose -f compose.yaml -f compose.local.yaml -p sophikron-ci down

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting and lint
        run: npm run lint

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Install Chromium for browser security tests
        run: npx playwright install --with-deps chromium

      - name: Test BFF security boundaries
        run: npm test

      - name: Build frontend
        run: npm run build
