x-database-environment: &database-environment
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-sophikron}
  DB_SSLMODE: disable

services:
  db:
    build:
      context: .
      dockerfile: infra/postgres/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-sophikron}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    secrets:
      - db_admin_password
      - db_app_password
      - db_migration_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PUBLISHED_PORT:-5432}:5432"
    networks:
      - sophikron_network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    build: &backend-build
      context: .
      dockerfile: backend/Dockerfile
    restart: "on-failure:3"
    environment:
      <<: *database-environment
      DB_USER: sophikron_app
      DB_PASSWORD_FILE: /run/secrets/db_app_password
      AUTH_KEYS_FILE: /run/secrets/identity_keys
      AUTH_SMTP_PASSWORD_FILE: ${AUTH_SMTP_USERNAME:+/run/secrets/smtp_password}
      AUTH_BOOTSTRAP_PASSWORD_FILE: /run/secrets/bootstrap_password
      # Allowlisted settings from .env; shell variables take precedence.
      # Empty YAML values inherit configuration instead of injecting the entire file.
      DB_POOL_SIZE:
      DB_MAX_OVERFLOW:
      DB_POOL_TIMEOUT:
      DB_POOL_RECYCLE:
      DB_CONNECT_TIMEOUT:
      DB_STATEMENT_TIMEOUT_MS:
      DB_LOCK_TIMEOUT_MS:
      DB_IDLE_TRANSACTION_TIMEOUT_MS:
      DB_HEALTH_TIMEOUT:
      AUTH_ENVIRONMENT:
      AUTH_ALLOWED_ORIGINS:
      AUTH_COOKIE_SECURE:
      AUTH_SESSION_SECONDS:
      AUTH_IDLE_SECONDS:
      AUTH_LOGIN_IP_LIMIT:
      AUTH_LOGIN_IDENTITY_LIMIT:
      AUTH_RATE_WINDOW_SECONDS:
      AUTH_LOGIN_RESERVATION_SECONDS:
      AUTH_PASSWORD_QUEUE_SIZE:
      AUTH_PASSWORD_QUEUE_TIMEOUT_SECONDS:
      AUTH_REQUEST_MAX_BYTES:
      AUTH_REQUEST_BODY_TIMEOUT_SECONDS:
      AUTH_MAIL_TRANSPORT:
      AUTH_SMTP_HOST:
      AUTH_SMTP_PORT:
      AUTH_SMTP_SECURITY:
      AUTH_SMTP_USERNAME:
      AUTH_SMTP_SENDER:
      AUTH_ACTIVATION_URL:
      AUTH_BOOTSTRAP_USERNAME:
    secrets:
      - db_app_password
      - identity_keys
      - bootstrap_password
      - smtp_password
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - sophikron_network
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build: *backend-build
    restart: "no"
    command: [alembic, upgrade, head]
    healthcheck:
      disable: true
    environment:
      <<: *database-environment
      DB_USER: sophikron_migrator
      DB_PASSWORD_FILE: /run/secrets/db_migration_password
      DB_STATEMENT_TIMEOUT_MS: "60000"
    secrets:
      - db_migration_password
    networks:
      - sophikron_network
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - sophikron_network
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:

secrets:
  db_admin_password:
    file: ${SOPHIKRON_SECRETS_DIRECTORY:?Set SOPHIKRON_SECRETS_DIRECTORY}/db_admin_password
  db_app_password:
    file: ${SOPHIKRON_SECRETS_DIRECTORY:?Set SOPHIKRON_SECRETS_DIRECTORY}/db_app_password
  db_migration_password:
    file: ${SOPHIKRON_SECRETS_DIRECTORY:?Set SOPHIKRON_SECRETS_DIRECTORY}/db_migration_password
  identity_keys:
    file: ${SOPHIKRON_SECRETS_DIRECTORY:?Set SOPHIKRON_SECRETS_DIRECTORY}/identity_keys.json
  bootstrap_password:
    file: ${SOPHIKRON_SECRETS_DIRECTORY:?Set SOPHIKRON_SECRETS_DIRECTORY}/bootstrap_password
  smtp_password:
    file: ${SOPHIKRON_SECRETS_DIRECTORY:?Set SOPHIKRON_SECRETS_DIRECTORY}/smtp_password

networks:
  sophikron_network:
    driver: bridge
