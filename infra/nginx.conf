# Include inside the HTTPS server block of your host reverse proxy.
# Configure its certificate, server_name and HTTP-to-HTTPS redirect separately.
client_max_body_size 16k;
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace incoming proxy headers; never append untrusted browser values.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
