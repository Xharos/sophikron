# Include inside the HTTPS server block of your host reverse proxy.
# Configure its certificate, server_name and HTTP-to-HTTPS redirect separately.
client_max_body_size 16k;
# Subscription URLs are credentials: omit them from access logs, including failures.
location ^~ /calendar-feed/ {
    access_log off;
    error_log /dev/null crit;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location = /lessons/download {
    # Permit queued requests to wait for a slot; stream without proxy buffering.
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location = /lessons/upload {
    client_max_body_size 50m;
    client_body_timeout 180s;
    proxy_request_buffering off;
    proxy_read_timeout 360s;
    proxy_send_timeout 180s;
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Replace incoming proxy headers; never append untrusted browser values.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
